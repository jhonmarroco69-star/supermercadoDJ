<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado DJ | Iniciar sesión</title>
    <link href="css/archivos.css" rel="stylesheet">
</head>
<body>
    <!-- contenedor de la pagina para iniciar sesion -->  
    <div class="login-card">
        <!-- Encabezado informativo -->
        <div class="login-header">
            <h1>Supermercado DJ</h1>
            <p>Ingrese sus credenciales para acceder al sistema</p>
        </div>

        <!-- Formulario de inicio de sesión -->
        <form action="HTML/dashboard.html" method="GET">
            <!--Campo de tipo de usuario-->
            <div class="form-group">
                <label for="tipo_usuario">Tipo de usuario</label>
                <select id="tipo_usuario" name="tipo_usuario" class="form-control" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="cliente">Cliente</option>
                    <option value="empleado">Empleado</option>
                </select>
            </div>

            <!--Campo de usuario o Correo electrónico-->
            <div class="form-group">
                <label for="username">Usuario, correo o código de empleado</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ej: cliente@correo.com o EMP-0032" required>
            </div>

            <!--Campo de contraseña-->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>

            <!--opciones para recordar sesión y recuperar clave de acceso-->
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Recordar sesión</span>
                </label>
            </div>

            <!--Botón de inicio de sesión-->
            <button type="submit" class="btn-submit">Iniciar Sesión</button>

            <!--Pie Página-->
            <footer class="login-footer">
                <p>¿Aun no tienes tu cuenta? <a href="HTML/registrar_cuenta.html">Regístrate aquí</a></p>
                <p class="copyright">&copy; 2023 Supermercado DJ. Todos los derechos reservados.</p>
            </footer>
        </form>
    </div>
</body>
</html>
